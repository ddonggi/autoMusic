duration_seconds: 180
batch_count: 10
genre: Study focus ambient
replace_instruments: true
music_context: deep study and concentration sessions
image_context: study focus music video
title_options:
  - Deep Work Hours
  - Clear Mind, Quiet Room
  - One Page at a Time
  - Focus Without Noise
  - The Long Afternoon
  - Steady Light
bpm_min: 70
bpm_max: 78
mood:
  - calm
  - focused
  - clear-headed
instruments:
  - warm electric piano
  - soft ambient pads
  - gentle low pulse
texture:
  - clean spacious atmosphere
  - subtle tape warmth
vocals: none
temperature: 0.85
lyria_retries: 3
lyria_retry_delay_seconds: 30
negative_rules:
  - no aggressive drums or sudden drops
  - no long silence
  - no abrupt ending
  - no vocals
  - no lead vocals
  - avoid static one-loop repetition
  - include subtle section changes
  - use gentle section changes for sustained concentration
  - no sudden volume changes
  - no harsh percussion or distracting rhythmic hooks
  - avoid dramatic builds and climaxes
prompt_variants:
