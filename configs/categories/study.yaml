duration_seconds: 180
timing_mode: natural
batch_count: 10
genre: Study focus ambient
replace_instruments: true
music_context: deep study and concentration sessions
image_context: study focus music video
title_options:
  - Deep Work Hours
  - Clear Mind, Quiet Room
  - One Page at a Time
  - Focus Without Noise
  - The Long Afternoon
  - Steady Light
bpm_min: 70
bpm_max: 78
mood:
  - calm
  - focused
  - clear-headed
instruments:
  - warm electric piano
  - soft ambient pads
  - gentle low pulse
texture:
  - clean spacious atmosphere
  - subtle tape warmth
vocals: none
temperature: 0.85
lyria_retries: 3
lyria_retry_delay_seconds: 30
negative_rules:
  - no aggressive drums, harsh percussion, or distracting rhythmic hooks
  - no sudden drops, volume changes, or dramatic climaxes
  - avoid long silence; keep quiet musical continuity
  - maintain a restrained dynamic range for sustained concentration
prompt_variants:
  - name: lofi-library
    performance_direction: "Keep felt piano in the foreground with a short, softly voiced theme; vary one inner chord tone on each return. Hold the room-tone pad far behind it and let the barely audible low pulse support the harmony without drawing attention."
    title_options: ["Sunlit Pages", "The Library Breathes"]
    bpm_min: 70
    bpm_max: 74
    mood:
      - warm
      - unhurried
      - attentive
    instruments:
      - felt piano chords
      - soft room-tone pad
      - barely audible low pulse
    texture:
      - sunlit library air
      - soft tape warmth
    arrangement:
      - "0:00-0:25 Intro: felt piano chords emerge with soft room-tone pad"
      - "0:25-0:55 Settle: add a barely audible low pulse beneath spacious harmony"
      - "0:55-1:25 Focus: continue the piano motif with gentle chord color changes"
      - "1:25-1:55 Rest: thin the texture to piano and quiet ambient air"
      - "1:55-2:30 Renew: return the warm pad and slow harmonic movement"
      - "2:30-3:00 Outro: let the piano and room tone fade naturally without abrupt cutoff"
  - name: rain-window-piano
    performance_direction: "Place soft electric piano in the foreground, returning to a simple phrase with small changes in voicing. Use actual quiet rain on a window, distant behind the electric piano rather than a rhythmic imitation; keep the rounded bass pulse subordinate and let it recede during the sparse passage."
    title_options: ["Rain on the Margin", "Window Notes"]
    bpm_min: 72
    bpm_max: 76
    mood:
      - peaceful
      - steady
      - grounded
    instruments:
      - soft electric piano
      - muted rain-like texture
      - rounded bass pulse
    texture:
      - quiet window rain ambience
      - smooth low contrast
    arrangement:
      - "0:00-0:20 Intro: quiet rain-like texture and soft electric piano enter slowly"
      - "0:20-0:50 Settle: add a rounded bass pulse at a restrained pace"
      - "0:50-1:25 Focus: repeat a simple piano phrase with slight harmonic variation"
      - "1:25-1:50 Rest: remove the bass pulse and leave the rain-like texture open"
      - "1:50-2:35 Renew: restore the gentle pulse and broaden the soft piano voicing"
      - "2:35-3:00 Outro: reduce the piano into quiet rain ambience and a natural fade"
  - name: deep-work-synth
    performance_direction: "Let mellow synth keys carry a compact theme close to the listener, varying the final note of each phrase. Keep the analog pad wide and behind the keys with slow harmonic shifts, while light sub bass quietly supports the roots."
    title_options: ["A Clear Thought", "Quiet Circuits"]
    bpm_min: 70
    bpm_max: 75
    mood:
      - intimate
      - calm
      - sustained
    instruments:
      - mellow synth keys
      - soft analog pad
      - light sub bass
    texture:
      - subtle cassette warmth
      - close quiet studio air
    arrangement:
      - "0:00-0:22 Intro: mellow synth keys appear over subtle cassette warmth"
      - "0:22-0:52 Settle: introduce a soft analog pad and light sub bass"
      - "0:52-1:22 Focus: keep the keys steady while the pad shifts gradually"
      - "1:22-1:52 Rest: lower the sub bass and leave a sparse key pattern"
      - "1:52-2:32 Renew: restore the warm pad with a slightly wider harmonic field"
      - "2:32-3:00 Outro: let the keys soften into close quiet studio air"
  - name: night-study-rhodes
    performance_direction: "Bring soft nocturnal Rhodes into the foreground with spacious phrases and gentle chord transitions; brighten the returning theme through voicing rather than volume. Keep the transparent pad and brushed pulse behind the Rhodes, with the pulse resting between sections."
    title_options: ["Lamplight Study", "After the Last Page"]
    bpm_min: 74
    bpm_max: 78
    mood:
      - clear
      - optimistic
      - composed
    instruments:
      - soft nocturnal Rhodes electric piano
      - transparent synth pad
      - soft brushed pulse
    texture:
      - quiet nighttime room ambience
      - clean gentle reverb
    arrangement:
      - "0:00-0:18 Intro: soft Rhodes notes rest inside a transparent synth pad"
      - "0:18-0:48 Settle: add a soft brushed pulse that stays behind the harmony"
      - "0:48-1:20 Focus: keep a clear piano pattern with slow chord transitions"
      - "1:20-1:48 Rest: suspend the pulse and leave spacious sustained notes"
      - "1:48-2:36 Renew: return the brushed pulse with gentle brighter voicings"
      - "2:36-3:00 Outro: release the notes into clean gentle reverb and a calm fade"
  - name: minimal-pulse-focus
    performance_direction: "Keep a low felt-piano figure in the foreground with ample space between notes; change only one note or chord color at each return. Place the dark pad and distant pulse deep in the background, letting the pulse recede while piano resonance carries the transition."
    title_options: ["Still Concentration", "The Quiet Pulse"]
    bpm_min: 70
    bpm_max: 74
    mood:
      - quiet
      - reflective
      - concentrated
    instruments:
      - low felt piano
      - dark ambient pad
      - soft distant pulse
    texture:
      - midnight room hush
      - restrained low-end warmth
    arrangement:
      - "0:00-0:24 Intro: low felt piano and midnight room hush establish a quiet space"
      - "0:24-0:54 Settle: add a soft distant pulse beneath the dark ambient pad"
      - "0:54-1:24 Focus: maintain a slow piano figure with minimal note movement"
      - "1:24-1:54 Rest: let the pulse recede and keep only the hush and piano"
      - "1:54-2:34 Renew: bring back the pad with slightly warmer sustained harmony"
      - "2:34-3:00 Outro: allow the low piano resonance to fade without a sudden ending"
  - name: soft-cafe-jazz
    performance_direction: "Let mellow jazz piano lead with a small theme and restrained extended chords, changing inner voices rather than adding busy runs. Keep upright bass quietly beneath the piano and brushes barely audible in the background; remove the brushes for a breathing passage before the theme returns."
    title_options: ["Coffee and Chapters", "A Table by the Window"]
    bpm_min: 72
    bpm_max: 77
    mood:
      - fresh
      - balanced
      - attentive
    instruments:
      - mellow jazz piano with restrained extended chords
      - quiet upright bass
      - barely audible brushed jazz drums
    texture:
      - calm botanical air
      - natural soft resonance
    arrangement:
      - "0:00-0:20 Intro: mellow jazz piano plays restrained extended chords"
      - "0:20-0:50 Settle: add quiet upright bass and barely audible brushes"
      - "0:50-1:24 Focus: continue a gentle jazz piano motif with small harmonic shifts"
      - "1:24-1:52 Rest: remove the brushes and leave piano and bass breathing"
      - "1:52-2:35 Renew: restore the brushes beneath warm piano voicings"
      - "2:35-3:00 Outro: thin the layers gradually into a quiet natural fade"
  - name: quiet-string-study
    performance_direction: "Open with sparse felt piano above quiet cello roots, then let a soft sustained viola carry the foreground line. Keep cello supportive and piano replies brief; develop the theme through slow inner-voice changes at constant volume, yielding to a gentle piano cadence."
    title_options: ["Quiet Strings", "Paper and Bow"]
    bpm_min: 64
    bpm_max: 70
    instruments:
      - "soft sustained viola"
      - "muted cello"
      - "sparse felt piano"
    texture:
      - patient chamber ambience
    arrangement:
      - "0:00-0:35 Opening: sparse piano with quiet cello roots"
      - "0:35-1:20 Layering: gradually add sustained viola without a crescendo"
      - "1:20-2:15 Development: move through slow chamber harmonies at constant volume"
      - "2:15-3:00 Resolution: let strings settle and end on a soft piano cadence"
  - name: acoustic-reading
    performance_direction: "Use only nylon-string guitar: bring the upper-string melody forward while quieter thumb-picked bass notes provide support. Revoice the same theme with small fingering changes and sparse ornaments, keeping wooden-room resonance behind the direct guitar sound; let the final chord ring naturally."
    title_options: ["Wood and Words", "An Open Chapter"]
    bpm_min: 66
    bpm_max: 72
    instruments:
      - "solo nylon-string guitar, no piano, no pads, no drums"
    texture:
      - intimate wooden room resonance
    arrangement:
      - "0:00-0:30 Introduction: a quiet fingerpicked guitar motif"
      - "0:30-1:15 Theme A: gentle alternating bass and spacious melody"
      - "1:15-2:00 Theme B: shift chord voicings without adding instruments"
      - "2:00-2:40 Return A: revisit the motif with subtle ornamentation"
      - "2:40-3:00 Coda: resolve with natural guitar resonance"
  - name: floating-vibraphone
    performance_direction: "Place soft, widely spaced vibraphone phrases in the foreground, varying their endings and leaving room for each decay. Keep the airy pad distant and bowed bass low and supportive; let a sustained bass answer fill the space between phrases without overtaking the vibraphone."
    title_options: ["Floating Notes", "Soft Reflections"]
    bpm_min: 68
    bpm_max: 74
    instruments:
      - "soft vibraphone"
      - "airy sustained pad"
      - "quiet bowed bass"
    texture:
      - delicate resonant air
    arrangement:
      - "0:00-0:40 Opening: widely spaced vibraphone notes"
      - "0:40-1:30 Expansion: add a soft pad beneath a restrained motif"
      - "1:30-2:20 Dialogue: alternate short vibraphone phrases with sustained bass"
      - "2:20-3:00 Dissolve: space the notes further apart and resolve softly"
  - name: minimal-piano-solo
    performance_direction: "Use only felt piano, with a sparse upper-register motif in the foreground and softer inner voices providing its harmonic support. Move the theme briefly into the lower register, then return with fewer notes; keep natural resonance behind the attacks and allow the final cadence to decay."
    title_options: ["Space Between Notes", "A Quiet Margin"]
    bpm_min: 60
    bpm_max: 68
    instruments:
      - "solo felt piano only, no pads, no bass instruments, no percussion"
    texture:
      - close natural piano resonance
    arrangement:
      - "0:00-0:30 Prelude: introduce a sparse piano figure"
      - "0:30-1:10 Variation I: change inner voices beneath the same motif"
      - "1:10-1:55 Variation II: move gently to the lower register"
      - "1:55-2:35 Reprise: bring the motif back with fewer notes"
      - "2:35-3:00 Cadence: resolve naturally with sustained piano decay"
  - name: warm-organ-focus
    performance_direction: "Let a quiet organ upper voice emerge gently from sustained chords while softer low organ tones support the harmony. Change one inner voice at a time to develop the theme without increasing volume; keep subdued upper harmonics forward of the faint room reverb and release the resolved chord gradually."
    title_options: ["Steady Glow", "Slow Turning Pages"]
    bpm_min: 60
    bpm_max: 66
    instruments:
      - "soft organ with subdued upper harmonics"
      - "gentle sustained low organ tones"
    texture:
      - warm low-contrast room reverb
    arrangement:
      - "0:00-0:45 Opening: a quiet organ chord settles gradually"
      - "0:45-1:35 Drift: change one inner voice at a time at constant volume"
      - "1:35-2:25 Deep focus: maintain soft low tones beneath slow harmonic movement"
      - "2:25-3:00 Closing: resolve the chord and gently release the sustained tones"
  - name: soft-electronic-flow
    performance_direction: "Keep muted synth plucks in the foreground with a short recurring motif; vary the spacing of the plucks for the middle passage, then restore the opening phrase at the same volume. Keep the soft pulse and rounded bass subordinate, with the transparent pad farther behind; remove support layers gradually before the final resolution."
    title_options: ["Gentle Current", "Forward in Silence"]
    bpm_min: 74
    bpm_max: 82
    instruments:
      - "muted synth plucks"
      - "soft electronic pulse"
      - "rounded synth bass"
      - "transparent pad"
    texture:
      - clean soft electronic warmth
    arrangement:
      - "0:00-0:20 Opening: muted plucks introduce a quiet motif"
      - "0:20-0:55 Foundation: add a soft pulse and rounded bass"
      - "0:55-1:35 Theme A: sustain the groove with small pad changes"
      - "1:35-2:10 Theme B: alter pluck spacing without a drop"
      - "2:10-2:40 Return: bring back the opening motif at equal volume"
      - "2:40-3:00 Outro: remove layers gradually and resolve softly"
