duration_seconds: 180
timing_mode: natural
batch_count: 10
genre: Brazilian phonk
music_context: syncopated dance grooves and short original hooks in a Brazilian funk / phonk hybrid
image_context: Brazilian funk/phonk music video
replace_instruments: true
title_options:
  - Side Street Signal
  - Asphalt in Motion
  - After Dark Circuit
bpm_min: 130
bpm_max: 150
mood:
  - dance-driven
  - rhythmically playful
instruments: []
texture:
  - selective gritty saturation
  - distinct kick and sub-bass transients
vocals: short_hooks
temperature: 1.1
lyria_retries: 3
lyria_retry_delay_seconds: 30
negative_rules:
  - keep kick and sub bass distinct rather than clipping the entire mix
  - avoid long verses or continuous singing; leave room for instrumental groove
  - use newly generated vocal performances, not copied recordings or recognizable song hooks
  - avoid long silence and resolve naturally without an abrupt cutoff
prompt_variants:
  - name: tamborzao-groove
    title_options: ["Corner Drum Conversation", "Steps in the Courtyard", "Streetlight Sway"]
    bpm_min: 130
    bpm_max: 140
    mood: [buoyant, playful, grounded]
    instruments:
      - dry interlocking tamborzao-inspired percussion
      - short rounded kick
      - deep answering bass notes
      - restrained two-note synth response
    texture:
      - close dry drum detail
      - small pockets of air between rhythmic hits
    performance_direction: "Put the interlocking percussion in the foreground with a syncopated tamborzao-inspired conversation. Let short bass notes answer the kick rather than doubling every hit; keep the two-note synth behind the drums and vary a percussion response when the hook returns."
    vocal_direction: "Create a new short call in natural Brazilian Portuguese, such as 'Solta o passo', with a brief answering phrase. Place the newly performed voice between percussion hits, repeat it sparingly with small rhythmic changes, and leave instrumental passages; do not use an existing recording or a recognizable song melody."
    arrangement:
      - "Opening: introduce the dry percussion conversation and a short vocal call"
      - "Groove: bring in the kick and answering bass while leaving space around the hook"
      - "Variation: change one percussion response and let the synth reply quietly"
      - "Return: restore the opening drum pattern with a fresh vocal answer"
      - "Resolution: thin the bass and percussion into a deliberate final phrase"
  - name: mandelao-pressure
    title_options: ["Concrete Breathing Room", "Low Corner Frequency", "Pressure Between Steps"]
    bpm_min: 130
    bpm_max: 145
    mood: [dark, sparse, commanding]
    instruments:
      - sparse hard kick accents
      - short metallic percussion ticks
      - crunchy distorted sub-bass stabs with a deep stable fundamental
      - minimal rough synth tone
    texture:
      - hard-edged bass saturation with a weighty sub fundamental
      - dry negative space around the drums
    performance_direction: "Make the sparse kick attack hard and immediate, followed by crunchy bass stabs that answer in the gaps. Give the bass a torn, buzzing upper edge while preserving a stable deep sub fundamental; let the bass briefly recede at each kick attack so the punch stays audible. Keep metallic ticks low and the rough synth secondary. Use a small number of forceful sounds and deliberate empty spaces; develop pressure by shifting a bass accent or withholding a hit, not by filling every gap, adding a long riser, or distorting the whole mix."
    vocal_direction: "Generate a new clipped Brazilian Portuguese call, such as 'Sente o grave', followed by a short original answer. Keep the delivery conversational and rhythmic, with separated repetitions and long instrumental gaps; synthesize a fresh performance rather than lifting an MC recording, and avoid extended verses."
    arrangement:
      - "Opening: expose a sparse kick pattern with a single short vocal call"
      - "Pressure: introduce crunchy sub-bass stabs with a stable low fundamental and quiet metallic responses"
      - "Space: withhold selected bass hits while a short vocal answer crosses the gaps"
      - "Return: restore the low-end pattern with a changed rhythmic accent"
      - "Resolution: settle the bass and close on a dry, intentional drum response"
  - name: automotivo-drive
    title_options: ["Night Lane Pulse", "Tail Lights in Rhythm", "Rolling Block Signal"]
    bpm_min: 140
    bpm_max: 150
    mood: [driving, confident, kinetic]
    instruments:
      - firm syncopated kick
      - tight baile-funk percussion
      - compact distorted 808 bass with short pitch glides
      - short metallic TR-808 cowbell hook
    texture:
      - focused low-end punch
      - crunchy 808 upper harmonics over a deep centered sub
      - sharp metallic hook and gritty pitch-down vocal chops
    performance_direction: "Keep the syncopated kick and tight percussion forward, with compact distorted 808 glides leaving each kick attack clear. Use a short two- or three-note minor-key cowbell motif as a metallic reply to the vocal, rather than a continuous busy lead. Keep the deepest bass centered and weighty while its upper harmonics rasp; briefly tuck the bass beneath each kick without turning the groove into continuous four-on-the-floor pumping. Shift the hook's final accent on its return, and preserve the same memorable motif through the changing drum pocket."
    vocal_direction: "Compose and newly perform a short hook in natural Brazilian Portuguese, such as 'Vai no balanço', with an energetic rhythmic answer. Chop the new performance into brief rhythmic fragments; apply a dark pitch-down character and a light gritty edge while retaining intelligible syllables. Let the vocal chops and metallic hook trade phrases, leaving instrumental gaps; use an original melody and freshly generated voice, with no borrowed recording, long verse, or continuous singing."
    arrangement:
      - "Opening: present the short minor-key metallic hook over a restrained kick pattern"
      - "Drive: add distorted 808 glides and gritty pitch-down vocal call-and-response"
      - "Switch: expose the percussion and vocal chops while the bass rests for a short passage"
      - "Return: bring back the metallic hook with a shifted final accent and full groove"
      - "Resolution: reduce the layers while preserving momentum into the final cadence"
  - name: montagem-switch
    title_options: ["Turn at the Crossbeat", "Two Corners One Pulse", "Cutback Conversation"]
    bpm_min: 135
    bpm_max: 150
    mood: [restless, inventive, dance-focused]
    instruments:
      - alternating syncopated drum patterns
      - dry rim and hand-percussion accents
      - short saturated bass punches
      - chopped original synth motif
    texture:
      - crisp montage-style rhythmic edits and tightly gated vocal chops
      - rough bass accents with clear transitions
    performance_direction: "Build two related drum pockets around the same short hook: one sparse and one busier. Keep the active percussion in front and saturated bass punches beneath it. Use a brief stop of one beat or less immediately before a phrase-boundary switch, followed by an immediate full-groove return; retain the pulse through the silence rather than using a long EDM build. Reassemble the same original synth motif and vocal chops into new rhythmic replies, so each switch changes the pressure without losing the track's identity."
    vocal_direction: "Write and newly perform two short Brazilian Portuguese calls, such as 'Vira o ritmo' and 'Segue no passo'. Cut this new performance into tight syllabic vocal chops; alternate the full brief calls with reordered fragments and occasional short stutters at the drum switches, not constant stuttering. Leave full instrumental phrases between entries; do not copy recorded vocals, quote existing song hooks, or develop a long verse."
    arrangement:
      - "Opening: establish the sparse drum pocket and first short call"
      - "First pocket: add bass punches and the original synth response"
      - "Second pocket: use a brief stop of one beat or less, then an immediate switch to busier percussion"
      - "Reassembly: alternate the two pockets around reordered vocal chops and the returning synth motif"
      - "Resolution: reunite the opening pocket and close with a concise rhythmic answer"
  - name: melodic-montagem
    title_options: ["Melody over Warm Asphalt", "Evening Steps Refrain", "Neon Window Turn"]
    bpm_min: 130
    bpm_max: 145
    mood: [melodic, warm, propulsive]
    instruments:
      - short expressive plucked-synth melody
      - syncopated baile-funk percussion
      - rounded kick
      - warm restrained bass line
      - faint harmonic pad
    texture:
      - lightly saturated melodic edges
      - soft harmonic depth behind the dry groove
    performance_direction: "Place a compact plucked-synth melody in front, supported by syncopated percussion and a bass line that leaves space for the kick. Keep the harmonic pad far behind the groove; vary the final notes and chord color of the same melody, then briefly remove the pad so the returning theme feels clear without an oversized build."
    vocal_direction: "Create a brief original melodic hook in natural Brazilian Portuguese, such as 'Deixa a noite girar', with a short rhythmic reply. Keep the voice and synth trading phrases rather than singing together continuously; generate a fresh vocal performance and melody, avoid recognizable borrowed hooks, and leave the main melody room to return instrumentally."
    arrangement:
      - "Opening: introduce the compact melody and a quiet percussion outline"
      - "Groove: add rounded bass and a brief original vocal phrase"
      - "Variation: change the melody ending and underlying chord color"
      - "Return: trade the vocal reply with the original synth theme over the restored groove"
      - "Resolution: release the pad and let the melodic phrase settle over thinning drums"
  - name: accelerated-baile
    title_options: ["Fast Steps Clear Air", "Sparks across the Block", "Quick Turn Echo"]
    bpm_min: 150
    bpm_max: 160
    mood: [fast, agile, exuberant]
    instruments:
      - fast interlocking baile-funk percussion
      - compact punchy kick
      - short clipped bass responses
      - sharp restrained synth accents
    texture:
      - crisp rapid transients
      - selective distortion on bass and synthetic chops
    performance_direction: "Keep fast interlocking percussion at the front with a compact kick and short bass responses that stay distinct at speed. Use restrained synth accents behind the rhythm, vary a fill or rest rather than adding constant rolls, and let the chopped voice function as another percussion layer."
    vocal_direction: "Generate fresh nonverbal syllables such as 'ta', 'ka', and 'dum', then chop them into short syncopated rhythmic answers. Use no lexical lyrics, quoted chant, existing vocal sample, long sung line, or continuous singing; leave gaps so the drums remain the main voice."
    arrangement:
      - "Opening: reveal a compact fast drum pocket and a brief nonverbal chop"
      - "Motion: add short bass responses and interlocking percussion"
      - "Break: momentarily expose the syllable chops and a reduced drum pattern"
      - "Return: restore the full pocket with a changed fill and restrained synth accents"
      - "Resolution: remove layers in phrase-sized steps and finish with a clean rhythmic landing"
