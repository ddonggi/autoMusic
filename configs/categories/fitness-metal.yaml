  - 'Main weight: add sustained bass and the half-time snare pattern'
  - 'Middle contrast: expose short guitar harmonics over reduced kick hits'
  - 'Final lift: return heavier chug accents and fuller band-drum responses'
  - 'Resolution: resolve the chug pattern and allow the final guitar chord to ring'
