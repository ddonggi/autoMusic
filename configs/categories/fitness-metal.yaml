  instruments:
  - low-tuned palm-muted rhythm guitars
  - picked electric bass
  - acoustic band drums with firm kick and dry snare
  - short restrained lead-guitar replies
  texture:
  - tight stop-start guitar articulation
  - compact room drum ambience
  performance_direction: Put a low-tuned palm-muted guitar riff in the foreground, with picked bass supporting its
    roots below and a firm acoustic kick and snare defining a heavy groove. Keep short lead replies behind the riff;
    vary its final accent, contrast it with a more open middle voicing, then return with tighter double-tracked
    guitars and stronger drum fills rather than constant loudness.
  arrangement:
  - 'Opening: present the palm-muted riff with a restrained drum pulse'
  - 'Main groove: lock picked bass and full band drums beneath the riff'
  - 'Middle contrast: open the guitar voicing and reduce the kick density'
  - 'Final lift: return the riff with changed accents, fuller guitars, and decisive drum replies'
  - 'Resolution: settle into a final band accent and natural amplifier decay'
