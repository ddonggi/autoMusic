- spacious midrange and high-frequency detail
vocals: none
temperature: 1.1
lyria_retries: 3
lyria_retry_delay_seconds: 30
negative_rules:
- no artist-name imitation or existing song references
- no lyrics, chants, spoken words, or vocal chops
- keep the kick and sub bass centered and distinct
- avoid long silence; finish with a naturally resolved ending
prompt_variants:
- name: rugged-cowbell
  bpm_min: 132
  bpm_max: 138
  mood:
  - rugged
  - aggressive
  - heavy-lifting
  instruments:
  - raspy cowbell lead
  - distorted 808 bass punches
  - hard clipped kick
  - dry hard snare
  - restrained syncopated percussion
  texture:
  - rough concrete gym grit
  - saturated low-end impact
  arrangement:
  - 'Opening: introduce the dry cowbell riff over restrained kick hits'
  - 'Foundation: add the centered 808, hard snare, and syncopated percussion'
  - 'Contrast: reduce the main drums and vary the riff ending above short bass pulses'
  - 'Final drive: restore the full groove with tighter snare answers and a fuller riff variation'
  - 'Resolution: strip layers in musical phrases and land on a deliberate final accent'
  performance_direction: Keep the raspy cowbell riff in the foreground over a firm kick and dry snare. Let the centered
    808 answer the riff without masking kick attacks; vary the riff ending and percussion accents, briefly reduce
    the drums in the middle, then return with stronger rhythmic answers rather than indiscriminate loudness.
