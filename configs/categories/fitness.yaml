  - 'Final drive: restore bass punches under a varied drum response and sharp hook accents'
  - 'Resolution: release the low-end pressure gradually into a controlled final rhythm'
  performance_direction: Let dense baile percussion drive the foreground rhythm while a hard kick and cutting snare
