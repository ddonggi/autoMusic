  - 'Final drive: restore the full pattern with stronger snare responses and clearer bass movement'
  - 'Resolution: settle the hook into a final rhythmic answer without a sudden cutoff'
  performance_direction: Keep the pounding kick and firm snare in front, with a tense short cowbell hook as the
